<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://stighellemans.github.io/meddeid/">
    <title>MedDeID documentation has moved</title>
    <script>
      const legacyPrefix = "/meddeid.github.io";
      const remainder = window.location.pathname.startsWith(legacyPrefix)
        ? window.location.pathname.slice(legacyPrefix.length)
        : "/";
      window.location.replace(
        "https://stighellemans.github.io/meddeid" + remainder + window.location.search + window.location.hash
      );
    </script>
  </head>
  <body>
    <p>MedDeID documentation has moved to <a href="https://stighellemans.github.io/meddeid/">its canonical website</a>.</p>
  </body>
</html>
